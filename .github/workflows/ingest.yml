name: Ingest FPL data

# Refreshes players, teams, gameweeks and fixtures, and records the day's price snapshot.
# FPL prices change once a night (around 01:30 UK time), so the 02:30 UTC run catches the
# new prices; the later runs keep form, injury news and fixtures fresh. Every run is an
# idempotent upsert, so late or repeated runs (GitHub's cron is best-effort) are harmless.

on:
  schedule:
    - cron: "30 2,8,14,20 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      FPLAI_DATABASE_URL: ${{ secrets.FPLAI_DATABASE_URL }}
    steps:
      - name: Skip until a database is configured
        if: env.FPLAI_DATABASE_URL == ''
        working-directory: .  # backend/ doesn't exist before checkout
        run: echo "No FPLAI_DATABASE_URL secret yet (see README, Deploy). Skipping ingest."
      - uses: actions/checkout@v7
        if: env.FPLAI_DATABASE_URL != ''
      - uses: actions/setup-python@v7
        if: env.FPLAI_DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
        if: env.FPLAI_DATABASE_URL != ''
      - name: Apply database migrations
        if: env.FPLAI_DATABASE_URL != ''
        run: alembic upgrade head
      - name: Ingest
        if: env.FPLAI_DATABASE_URL != ''
        run: python -m app.ingest.run
