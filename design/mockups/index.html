<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design options</title>
<style>
  body { margin: 0; font: 14px/20px system-ui, sans-serif; background: #e9ebea; color: #111; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  .group { display: inline-flex; background: #f0f1f0; border-radius: 8px; padding: 3px; }
  button { font: inherit; border: 0; background: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: #555; }
  button[aria-pressed="true"] { background: #fff; color: #111; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  a { margin-left: auto; color: #1f7a3a; }
  main { display: grid; place-items: start center; padding: 16px; }
  iframe { border: 0; background: #fff; border-radius: 12px; width: 100%; height: calc(100vh - 100px); transition: width .35s cubic-bezier(.2,.8,.2,1); }
  iframe.phone { width: 390px; height: 844px; border-radius: 28px; box-shadow: 0 0 0 8px #111; }
</style>
</head>
<body>
<header>
  <h1>FPL Assistant · design options</h1>
  <div class="group" id="opt">
    <button aria-pressed="true" data-src="a-fpl.html">A · FPL colours</button>
    <button aria-pressed="false" data-src="a-floodlight.html">A · original</button>
    <button aria-pressed="false" data-src="b-programme.html">B · Matchday programme</button>
    <button aria-pressed="false" data-src="c-ladder.html">C · Pitch ladder</button>
  </div>
  <div class="group" id="size">
    <button aria-pressed="false" data-size="phone">Phone</button>
    <button aria-pressed="true" data-size="desktop">Desktop</button>
  </div>
  <a id="open" href="a-fpl.html" target="_blank">Open on its own</a>
</header>
<main><iframe id="frame" src="a-fpl.html" title="Design option"></iframe></main>
<script>
const frame = document.getElementById("frame"), open = document.getElementById("open");
const pick = (group, btn) => group.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
document.querySelectorAll("#opt button").forEach((b) => b.onclick = () => { pick(b.parentElement, b); frame.src = open.href = b.dataset.src; });
document.querySelectorAll("#size button").forEach((b) => b.onclick = () => { pick(b.parentElement, b); frame.classList.toggle("phone", b.dataset.size === "phone"); });
</script>
</body>
</html>
