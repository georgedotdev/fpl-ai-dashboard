# Local development database. Production uses Neon (hosted Postgres); see DECISIONS.md D-004.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fpl
      POSTGRES_PASSWORD: fpl
      POSTGRES_DB: fpl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpl -d fpl"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
