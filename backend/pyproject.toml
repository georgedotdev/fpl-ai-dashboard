[project]
name = "fpl-ai-backend"
version = "0.1.0"
description = "Backend for the AI FPL Assistant: FPL data layer, prediction, optimization and explanation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "tenacity>=8.5",
    # IANA time zones for zoneinfo on Windows (Linux has them built in).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.rules" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
